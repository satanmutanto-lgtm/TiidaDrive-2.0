sted = false;\n  var lastFix = 0;\n  var toastTimer = null;\n  var beatTimer = null;\n\n  function hasBridge() { return !!window.Tiida; }\n  function invoke(method, arg) {\n    if (!hasBridge() || typeof window.Tiida[method] !== 'function') {\n      note('Функция доступна после установки APK на Android');\n      return null;\n    }\n    try {\n      return arguments.length > 1 ? window.Tiida[method](arg) : window.Tiida[method]();\n    } catch(e) {\n      note('Операция недоступна на этом устройстве');\n      return null;\n    }\n  }\n  function esc(value) {\n    return String(value == null ? '' : value).replace(/[&<>\"']/g, function(c) {\n      return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c];\n    });\n  }\n  function parse(value, fallback) { try {return JSON.parse(value);} catch(e){return fallback;} }\n  function note(message) {\n    toast.textContent = message;\n    toast.classList.add('visible');\n    clearTimeout(toastTimer);\n    toastTimer = setTimeout(function(){toast.classList.remove('visible');}, 3500);\n  }\n  function clock() {\n    var d = new Date();\n    function p(n){return n < 10 ? '0' + n : String(n);}\n    document.getElementById('clockTime').textContent = p(d.getHours()) + ':' + p(d.getMinutes());\n    try {document.getElementById('clockDate').textContent = d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});}\n    catch(e){document.getElementById('clockDate').textContent = p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear();}\n    if (lastFix && Date.now() - lastFix > 15000) {\n      statusEl.classList.remove('ready');\n      statusEl.innerHTML = '<i></i> НЕТ СИГНАЛА';\n      speedEl.textContent = '0';\n      document.getElementById('speedBar').style.width = '0%';\n      lastFix = 0;\n    }\n  }\n  function updateLights() {\n    if (lights) car.classList.add('lights-on');\n    else car.classList.remove('lights-on');\n    document.getElementById('lightMode').textContent = lights ? 'ВКЛ.' : 'ВЫКЛ.';\n    var btn = document.querySelector('[data-action=\"lights\"]');\n    if(btn) btn.classList.toggle('active', lights);\n  }\n  function updateSync() {\n    var btn = document.querySelector('[data-action=\"musicSync\"]');\n    if(btn) btn.classList.toggle('active',syncing);\n  }\n  function show(title, overline) {\n    currentModal = title;\n    document.getElementById('modalTitle').textContent = title;\n    document.getElementById('modalOverline').textContent = overline || 'TIIDA DRIVE 2.0';\n    modal.classList.add('open');\n    modal.setAttribute('aria-hidden','false');\n    content.scrollTop = 0;\n  }\n  function close() {\n    currentModal = '';\n    modal.classList.remove('open');\n    modal.setAttribute('aria-hidden','true');\n    content.innerHTML = '';\n  }\n  function refreshApps() {\n    var raw = invoke('apps');\n    cachedApps = raw ? parse(raw,[]) : [];\n    renderApps();\n  }\n  function renderApps() {\n    content.innerHTML = '<input id=\"appSearch\" class=\"search\" placeholder=\"Поиск приложений...\" autocomplete=\"off\"><div id=\"appGrid\" class=\"app-grid\"></div>';\n    var field = document.getElementById('appSearch');\n    field.addEventListener('input', function(){renderAppGrid(field.value);});\n    renderAppGrid('');\n  }\n  function renderAppGrid(query) {\n    var list = cachedApps.filter(function(app){\n      return String(app.name).toLowerCase().indexOf(String(query).toLowerCase()) >= 0;\n    });\n    var grid = document.getElementById('appGrid');\n    if(!grid) return;\n    if(!list.length){grid.innerHTML='<div class=\"empty\">Приложения не найдены. На устройстве должен быть установлен APK.</div>';return;}\n    grid.innerHTML = list.map(function(app,i){\n      return '<button class=\"app-tile\" data-pkg=\"'+esc(app.pkg)+'\"><i>'+esc(String(app.name||'?').charAt(0).toUpperCase())+'</i><span>'+esc(app.name)+'</span></button>';\n    }).join('');\n  }\n  function refreshPhone() {\n    var raw = invoke('phone');\n    if(raw) cachedPhone = parse(raw,{allowed:false,contacts:[],recent:[]});\n    renderPhone();\n  }\n  function phoneRow(item, extra) {\n    var num = item.number || '';\n    var label = item.name || num || 'Неизвестный номер';\n    var noteText = item.name ? num : (extra || 'Номер телефона');\n    if (extra && item.name) noteText = num+' · '+extra;\n    return '<button class=\"phone-row\" data-number=\"'+esc(num)+'\"><span><b>'+esc(label)+'</b><small>'+esc(noteText)+'</small></span><span class=\"phone-icon\">↗</span></button>';\n  }\n  function renderPhone() {\n    var tabs = [['favorites','Избранные'],['contacts','Контакты'],['recent','Недавние'],['dial','Набор']];\n    content.innerHTML = '<div class=\"tabs\">'+tabs.map(function(t){return '<button data-tab=\"'+t[0]+'\" class=\"'+(phoneTab===t[0]?'active':'')+'\">'+t[1]+'</button>';}).join('')+'</div><div id=\"phoneBody\"></div>';\n    var holder = document.getElementById('phoneBody');\n    if (phoneTab==='dial') {\n      holder.innerHTML = '<input id=\"dialNumber\" class=\"dial-number\" placeholder=\"+7...\" type=\"tel\"><div class=\"dial-pad\">'+['1','2','3','4','5','6','7','8','9','*','0','#'].map(function(k){return '<button data-digit=\"'+k+'\">'+k+'</button>';}).join('')+'</div><button class=\"dial-call\" data-action=\"dialNow\">Позвонить ↗</button>';\n      return;\n    }\n    if (!cachedPhone.allowed) {\n      holder.innerHTML = '<div class=\"empty\">Чтобы открыть контакты и историю вызовов, разрешите доступ в Android.<br><br><button class=\"primary\" data-action=\"phonePermission\">Разрешить доступ</button></div>';\n      return;\n    }\n    var list = [];\n    if(phoneTab==='favorites') list = cachedPhone.contacts.filter(function(x){return x.star;});\n    else if(phoneTab==='contacts') list = cachedPhone.contacts;\n    else list = cachedPhone.recent;\n    if(!list.length) {holder.innerHTML='<div class=\"empty\">Здесь пока нет записей.</div>';return;}\n    holder.innerHTML = '<div class=\"phone-list\">'+list.map(function(item){\n      var extra = '';\n      if (phoneTab==='recent') {\n        try{extra = new Date(item.date).toLocaleString('ru-RU');}catch(e){}\n      }\n      return phoneRow(item,extra);\n    }).join('')+'</div>';\n  }\n  function renderSettings() {\n    content.innerHTML =\n      '<div class=\"setting\"><div><b>Фары на экране</b><small>Плавное включение подсветки Tiida</small></div><button data-action=\"lights\">'+(lights?'Выключить':'Включить')+'</button></div>'+\n      '<div class=\"setting\"><div><b>Свет в ритме музыки</b><small>Попытка захвата системного аудио. Зависит от магнитолы и разрешений Android.</small></div><button data-action=\"musicSync\">'+(syncing?'Выключить':'Включить')+'</button></div>'+\n      '<div class=\"setting\"><div><b>Геолокация</b><small>Спидометр использует реальную скорость спутниковых координат.</small></div><button data-action=\"location\">Проверить</button></div>'+\n      '<div class=\"setting\"><div><b>Bluetooth</b><small>Открыть системные настройки подключения телефона.</small></div><button data-action=\"bluetooth\">Открыть</button></div>'+\n      '<div class=\"setting\"><div><b>Фоновые приложения</b><small>Попытка очистки процессов, кроме Яндекс Музыки. Android может запретить завершение чужих приложений.</small></div><button data-action=\"clear\">Очистить</button></div>'+\n      '<div class=\"setting\"><div><b>Tiida Drive 2.0</b><small>Версия 2.0.0 · Android 6+ · Nissan Tiida C11</small></div></div>';\n  }\n  function action(name) {\n    switch(name) {\n      case 'apps':show('Приложения','ВСЕ УСТАНОВЛЕННЫЕ');refreshApps();break;\n      case 'phone':phoneTab='favorites';show('Телефон','КОНТАКТЫ И ВЫЗОВЫ');refreshPhone();break;\n      case 'recent':phoneTab='recent';show('Телефон','ИСТОРИЯ ВЫЗОВОВ');refreshPhone();break;\n      case 'settings':show('Настройки');renderSettings();break;\n      case 'close':close();break;\n      case 'lights':lights=!lights;updateLights();if(currentModal==='Настройки')renderSettings();break;\n      case 'musicSync':\n        if(syncing || syncRequested) {syncRequested=false;syncing=false;invoke('syncMusic',false);}\n        else {syncRequested=true;invoke('syncMusic',true);note('Запуск синхронизации — может потребоваться разрешение');}\n        updateSync();if(currentModal==='Настройки')renderSettings();break;\n      case 'musicApp':invoke('musicApp');break;\n      case 'navigation':invoke('navigation');break;\n      case 'bluetooth':invoke('bluetooth');break;\n      case 'clear':invoke('clearBackground');break;\n      case 'prev':invoke('musicKey','prev');break;\n      case 'play':invoke('musicKey','play');break;\n      case 'next':invoke('musicKey','next');break;\n      case 'location':invoke('requestLocation');break;\n      case 'phonePermission':invoke('requestPhone');break;\n      case 'dialNow':\n        var field = document.getElementById('dialNumber');\n        if(field && field.value.trim()) invoke('dial',field.value.trim());break;\n    }\n  }\n  document.addEventListener('click', function(ev) {\n    var target = ev.target;\n    while(target && target !== document) {\n      if (target.getAttribute) {\n        if(target.hasAttribute('data-action')){action(target.getAttribute('data-action'));return;}\n        if(target.hasAttribute('data-tab')){phoneTab=target.getAttribute('data-tab');renderPhone();return;}\n        if(target.hasAttribute('data-pkg')){invoke('openPackage',target.getAttribute('data-pkg'));return;}\n        if(target.hasAttribute('data-number')){invoke('dial',target.getAttribute('data-number'));return;}\n        if(target.hasAttribute('data-digit')){\n          var input=document.getElementById('dialNumber');if(input)input.value+=target.getAttribute('data-digit');return;\n        }\n      }\n      target=target.parentNode;\n    }\n  });\n\n  window.TiidaUI = {\n    note:note,\n    onLocation:function(speed,accuracy) {\n      var number = Math.max(0, Math.min(399, Number(speed)||0));\n      speedEl.textContent = String(number);\n      document.getElementById('speedBar').style.width = Math.min(100,number/2.2)+'%';\n      statusEl.classList.add('ready');\n      statusEl.innerHTML = '<i></i> СИГНАЛ';\n      lastFix=Date.now();\n      var road=document.querySelector('.road');\n      if(road)road.style.animationDuration = Math.max(.6,3-number/70)+'s';\n    },\n    onBeat:function(level) {\n      if (!syncing || level < 32) return;\n      car.classList.add('beat');\n      clearTimeout(beatTimer);\n      beatTimer=setTimeout(function(){car.classList.remove('beat');},150);\n    },\n    syncState:function(active) {\n      syncing=!!active;syncRequested=!!active;updateSync();\n      if(currentModal==='Настройки')renderSettings();\n    },\n    refreshPhone:refreshPhone,\n    resize:function(){},\n    back:function(){if(currentModal){close();return 'handled';}return 'exit';}\n  };\n\n  setInterval(clock,1000);\n  clock();\n  updateLights();\n  updateSync();\n  setInterval(function() {\n    car.classList.add('window-open');\n    setTimeout(function(){car.classList.remove('window-open');},3700);\n  },24000);\n  if(!hasBridge()) note('Предпросмотр: функции устройства доступны в Android APK');\n})();\n","app/src/main/res/drawable/ic_tiida.xml":"<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<vector xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    android:width=\"108dp\" android:height=\"108dp\"\n    android:viewportWidth=\"108\" android:viewportHeight=\"108\">\n    <path android:fillColor=\"#06182C\" android:pathData=\"M0,0 L108,0 L108,108 L0,108 Z\"/>\n    <path android:fillColor=\"#145585\" android:pathData=\"M12,76 L20,50 L32,44 L41,29 L67,29 L77,44 L88,50 L96,76 L88,86 L20,86 Z\"/>\n    <path android:fillColor=\"#5BC8FE\" android:pathData=\"M35,45 L44,33 L64,33 L73,45 Z\"/>\n    <path android:fillColor=\"#08182B\" android:pathData=\"M35,46 L73,46 L80,58 L29,58 Z\"/>\n    <path android:fillColor=\"#D6F7FF\" android:pathData=\"M18,67 L40,69 L43,77 L19,75 Z M68,69 L90,67 L89,75 L65,77 Z\"/>\n    <path android:fillColor=\"#05101C\" android:pathData=\"M41,69 L67,69 L65,81 L43,81 Z\"/>\n    <path android:fillColor=\"#63CFFF\" android:pathData=\"M19,88 L89,88 L89,92 L19,92 Z\"/>\n</vector>\n"}''')
