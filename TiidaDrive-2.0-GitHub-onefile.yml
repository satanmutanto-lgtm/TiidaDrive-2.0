name: Build Tiida Drive 2.0 APK (one-file)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate Tiida Drive source files
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          project = json.loads(r'''{"settings.gradle":"pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\nrootProject.name = 'TiidaDrive2'\ninclude ':app'\n","build.gradle":"plugins {\n    id 'com.android.application' version '8.5.2' apply false\n}\n","gradle.properties":"org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\n",".gitignore":".gradle/\nbuild/\napp/build/\nlocal.properties\n*.apk\n*.aab\n*.keystore\n*.jks\n.idea/\n","app/build.gradle":"plugins { id 'com.android.application' }\n\nandroid {\n    namespace 'com.tiidadrive.launcher'\n    compileSdk 34\n\n    defaultConfig {\n        applicationId 'com.tiidadrive.launcher'\n        minSdk 23\n        targetSdk 28\n        versionCode 200\n        versionName '2.0.0'\n    }\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_1_8\n        targetCompatibility JavaVersion.VERSION_1_8\n    }\n}\n","app/src/main/AndroidManifest.xml":"<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\"/>\n    <uses-permission android:name=\"android.permission.READ_CONTACTS\"/>\n    <uses-permission android:name=\"android.permission.READ_CALL_LOG\"/>\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\"/>\n    <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\"/>\n    <uses-permission android:name=\"android.permission.KILL_BACKGROUND_PROCESSES\"/>\n    <application\n        android:allowBackup=\"false\"\n        android:label=\"Tiida Drive 2.0\"\n        android:icon=\"@drawable/ic_tiida\"\n        android:theme=\"@android:style/Theme.Material.NoActionBar\"\n        android:usesCleartextTraffic=\"false\"\n        android:hardwareAccelerated=\"true\">\n        <activity android:name=\".MainActivity\"\n            android:exported=\"true\"\n            android:configChanges=\"orientation|screenSize|keyboardHidden\"\n            android:windowSoftInputMode=\"adjustResize\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"/>\n                <category android:name=\"android.intent.category.LAUNCHER\"/>\n            </intent-filter>\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"/>\n                <category android:name=\"android.intent.category.HOME\"/>\n                <category android:name=\"android.intent.category.DEFAULT\"/>\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n","README.md":"# Tiida Drive 2.0\n\nАвтомобильный Android-лаунчер для Nissan Tiida C11 и Android-магнитол (Android 6+).\n\n- Цифровой GPS-спидометр без подписи «GPS»\n- Ночной PREMIUM DRIVE: перспектива городской дороги, голубой маршрут и синяя Tiida\n- Анимация фар и открывающихся окон; синхронизация света с аудио (если разрешит устройство)\n- Яндекс Музыка, медиакнопки, Bluetooth, навигатор, список приложений\n- Телефон: контакты, избранное, недавние вызовы и быстрый набор\n- Системные панели Android остаются видимыми\n- Вертикальные и горизонтальные экраны\n\n## Получить APK\nОткройте вкладку **Actions** → последний успешный запуск **Build Tiida Drive 2.0 APK** → **Artifacts** → **TiidaDrive-2.0-Android-APK**. Внутри ZIP находится `app-debug.apk`: он автоматически подписан тестовым Android-ключом и устанавливается вручную.\n\n## Разрешения\nМестоположение — скорость. Контакты и журнал звонков — телефонная панель. Микрофон/аудио — опциональная синхронизация световых эффектов. Android может блокировать доступ к аудиомикшеру и завершение чужих процессов; в этом случае приложение сообщает об ограничении, не имитируя работу функции.\n\n**Важно:** это экранная анимация фар. Приложение не управляет физическими фарами автомобиля. Скорость берётся из GPS при наличии разрешения и сигнала спутников. Не взаимодействуйте с экраном во время движения.\n","app/src/main/java/com/tiidadrive/launcher/MainActivity.java":"package com.tiidadrive.launcher;\n\nimport android.Manifest;\nimport android.app.Activity;\nimport android.app.ActivityManager;\nimport android.content.Context;\nimport android.content.Intent;\nimport android.content.pm.PackageManager;\nimport android.content.pm.ResolveInfo;\nimport android.content.res.Configuration;\nimport android.database.Cursor;\nimport android.graphics.Color;\nimport android.location.Location;\nimport android.location.LocationListener;\nimport android.location.LocationManager;\nimport android.media.AudioManager;\nimport android.media.audiofx.Visualizer;\nimport android.net.Uri;\nimport android.os.Build;\nimport android.os.Bundle;\nimport android.os.Handler;\nimport android.os.Looper;\nimport android.provider.CallLog;\nimport android.provider.ContactsContract;\nimport android.provider.Settings;\nimport android.view.KeyEvent;\nimport android.webkit.JavascriptInterface;\nimport android.webkit.WebChromeClient;\nimport android.webkit.WebView;\nimport android.webkit.WebViewClient;\nimport org.json.JSONArray;\nimport org.json.JSONObject;\nimport java.util.ArrayList;\nimport java.util.Collections;\nimport java.util.Comparator;\nimport java.util.List;\n\npublic class MainActivity extends Activity implements LocationListener {\n    private static final int LOCATION_REQUEST = 41;\n    private static final int PHONE_REQUEST = 42;\n    private static final int AUDIO_REQUEST = 43;\n    private final Handler main = new Handler(Looper.getMainLooper());\n    private WebView web;\n    private LocationManager locations;\n    private Visualizer visualizer;\n    private boolean wantsAudio;\n    private long lastBeat;\n\n    @Override public void onCreate(Bundle state) {\n        super.onCreate(state);\n        getWindow().setStatusBarColor(Color.rgb(5, 10, 20));\n        getWindow().setNavigationBarColor(Color.rgb(5, 10, 20));\n        getWindow().getDecorView().setSystemUiVisibility(0);\n        web = new WebView(this);\n        web.setBackgroundColor(Color.rgb(4, 9, 20));\n        web.getSettings().setJavaScriptEnabled(true);\n        web.getSettings().setDomStorageEnabled(true);\n        web.getSettings().setAllowFileAccess(true);\n        web.setWebViewClient(new WebViewClient());\n        web.setWebChromeClient(new WebChromeClient());\n        web.addJavascriptInterface(new DeviceBridge(), \"Tiida\");\n        setContentView(web);\n        web.loadUrl(\"file:///android_asset/index.html\");\n        locations = (LocationManager) getSystemService(LOCATION_SERVICE);\n        if (!granted(Manifest.permission.ACCESS_FINE_LOCATION)) {\n            main.postDelayed(() -> requestPermissions(new String[] {\n                Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION\n            }, LOCATION_REQUEST), 800);\n        } else {\n            startLocation();\n        }\n    }\n\n    private boolean granted(String permission) {\n        return Build.VERSION.SDK_INT < 23 || checkSelfPermission(permission) == PackageManager.PERMISSION_GRANTED;\n    }\n\n    private void sendJs(String script) {\n        main.post(() -> {\n            if (web != null) web.evaluateJavascript(script, null);\n        });\n    }\n\n    private void startLocation() {\n        if (!granted(Manifest.permission.ACCESS_FINE_LOCATION) || locations == null) return;\n        try {\n            if (locations.isProviderEnabled(LocationManager.GPS_PROVIDER))\n                locations.requestLocationUpdates(LocationManager.GPS_PROVIDER, 1000L, 0.5f, this);\n            if (locations.isProviderEnabled(LocationManager.NETWORK_PROVIDER))\n                locations.requestLocationUpdates(LocationManager.NETWORK_PROVIDER, 3000L, 2f, this);\n            Location last = locations.getLastKnownLocation(LocationManager.GPS_PROVIDER);\n            if (last != null) onLocationChanged(last);\n        } catch (Exception ignored) {\n            sendJs(\"window.TiidaUI && TiidaUI.note('Проверьте разрешение геолокации')\");\n        }\n    }\n\n    @Override public void onLocationChanged(Location location) {\n        double speed = location.hasSpeed() ? Math.max(0, location.getSpeed() * 3.6d) : 0;\n        double accuracy = location.hasAccuracy() ? location.getAccuracy() : -1;\n        sendJs(\"window.TiidaUI && TiidaUI.onLocation(\" + Math.round(speed) + \",\" + Math.round(accuracy) + \")\");\n    }\n    @Override public void onProviderEnabled(String provider) { startLocation(); }\n    @Override public void onProviderDisabled(String provider) {\n        sendJs(\"window.TiidaUI && TiidaUI.note('Нет сигнала геолокации')\");\n    }\n\n    @Override public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] results) {\n        super.onRequestPermissionsResult(requestCode, permissions, results);\n        if (requestCode == LOCATION_REQUEST && granted(Manifest.permission.ACCESS_FINE_LOCATION)) startLocation();\n        if (requestCode == PHONE_REQUEST) sendJs(\"window.TiidaUI && TiidaUI.refreshPhone()\");\n        if (requestCode == AUDIO_REQUEST && granted(Manifest.permission.RECORD_AUDIO) && wantsAudio) startAudioSync();\n    }\n\n    private void startAudioSync() {\n        stopAudioSync();\n        try {\n            visualizer = new Visualizer(0);\n            visualizer.setEnabled(false);\n            visualizer.setCaptureSize(Visualizer.getCaptureSizeRange()[0]);\n            visualizer.setDataCaptureListener(new Visualizer.OnDataCaptureListener() {\n                @Override public void onWaveFormDataCapture(Visualizer v, byte[] wave, int rate) {\n                    long now = android.os.SystemClock.elapsedRealtime();\n                    if (now - lastBeat < 90) return;\n                    lastBeat = now;\n                    double sum = 0;\n                    for (byte b : wave) {\n                        int sample = (b & 255) - 128;\n                        sum += sample * sample;\n                    }\n                    int level = Math.min(100, (int)(Math.sqrt(sum / wave.length) * 2.4));\n                    sendJs(\"window.TiidaUI && TiidaUI.onBeat(\" + level + \")\");\n                }\n                @Override public void onFftDataCapture(Visualizer v, byte[] fft, int rate) { }\n            }, Visualizer.getMaxCaptureRate() / 2, true, false);\n            visualizer.setEnabled(true);\n            sendJs(\"window.TiidaUI && TiidaUI.syncState(true)\");\n        } catch (Exception e) {\n            stopAudioSync();\n            sendJs(\"window.TiidaUI && TiidaUI.syncState(false)\");\n            sendJs(\"window.TiidaUI && TiidaUI.note('Аудиозахват не поддерживается магнитолой')\");\n        }\n    }\n\n    private void stopAudioSync() {\n        if (visualizer != null) {\n            try { visualizer.setEnabled(false); visualizer.release(); } catch (Exception ignored) { }\n            visualizer = null;\n        }\n    }\n\n    private void launchIntent(Intent intent) {\n        main.post(() -> {\n            try { startActivity(intent); }\n            catch (Exception e) { sendJs(\"window.TiidaUI && TiidaUI.note('Приложение недоступно')\"); }\n        });\n    }\n\n    private JSONArray installedApps() {\n        JSONArray out = new JSONArray();\n        Intent query = new Intent(Intent.ACTION_MAIN);\n        query.addCategory(Intent.CATEGORY_LAUNCHER);\n        PackageManager pm = getPackageManager();\n        List<ResolveInfo> list = new ArrayList<>(pm.queryIntentActivities(query, 0));\n        Collections.sort(list, Comparator.comparing(r -> String.valueOf(r.loadLabel(pm)), String.CASE_INSENSITIVE_ORDER));\n        for (ResolveInfo item : list) {\n            try {\n                String pkg = item.activityInfo.packageName;\n                if (pkg.equals(getPackageName())) continue;\n                JSONObject obj = new JSONObject();\n                obj.put(\"name\", String.valueOf(item.loadLabel(pm)));\n                obj.put(\"pkg\", pkg);\n                out.put(obj);\n            } catch (Exception ignored) { }\n        }\n        return out;\n    }\n\n    private JSONObject phoneData() {\n        JSONObject response = new JSONObject();\n        JSONArray contacts = new JSONArray();\n        JSONArray recent = new JSONArray();\n        boolean canContacts = granted(Manifest.permission.READ_CONTACTS);\n        boolean canCalls = granted(Manifest.permission.READ_CALL_LOG);\n        if (canContacts) {\n            Cursor cursor = null;\n            try {\n                cursor = getContentResolver().query(ContactsContract.CommonDataKinds.Phone.CONTENT_URI,\n                    new String[]{ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME,\n                        ContactsContract.CommonDataKinds.Phone.NUMBER, ContactsContract.Contacts.STARRED},\n                    null, null, ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + \" ASC\");\n                int count = 0;\n                while (cursor != null && cursor.moveToNext() && count++ < 600) {\n                    JSONObject o = new JSONObject();\n                    o.put(\"name\", cursor.getString(0) == null ? \"Без имени\" : cursor.getString(0));\n                    o.put(\"number\", cursor.getString(1) == null ? \"\" : cursor.getString(1));\n                    o.put(\"star\", cursor.getInt(2) == 1);\n                    contacts.put(o);\n                }\n            } catch (Exception ignored) { }\n            finally { if (cursor != null) cursor.close(); }\n        }\n        if (canCalls) {\n            Cursor cursor = null;\n            try {\n                cursor = getContentResolver().query(CallLog.Calls.CONTENT_URI,\n                    new String[]{CallLog.Calls.CACHED_NAME, CallLog.Calls.NUMBER,\n                        CallLog.Calls.TYPE, CallLog.Calls.DATE}, null, null,\n                    CallLog.Calls.DATE + \" DESC\");\n                int count = 0;\n                while (cursor != null && cursor.moveToNext() && count++ < 60) {\n                    JSONObject o = new JSONObject();\n                    o.put(\"name\", cursor.getString(0) == null ? \"\" : cursor.getString(0));\n                    o.put(\"number\", cursor.getString(1) == null ? \"\" : cursor.getString(1));\n                    o.put(\"type\", cursor.getInt(2));\n                    o.put(\"date\", cursor.getLong(3));\n                    recent.put(o);\n                }\n            } catch (Exception ignored) { }\n            finally { if (cursor != null) cursor.close(); }\n        }\n        try {\n            response.put(\"allowed\", canContacts && canCalls);\n            response.put(\"contacts\", contacts);\n            response.put(\"recent\", recent);\n        } catch (Exception ignored) { }\n        return response;\n    }\n\n    public class DeviceBridge {\n        @JavascriptInterface public String apps() { return installedApps().toString(); }\n        @JavascriptInterface public String phone() { return phoneData().toString(); }\n        @JavascriptInterface public void requestPhone() {\n            main.post(() -> requestPermissions(new String[]{\n                Manifest.permission.READ_CONTACTS, Manifest.permission.READ_CALL_LOG\n            }, PHONE_REQUEST));\n        }\n        @JavascriptInterface public void requestLocation() {\n            main.post(() -> {\n                if (granted(Manifest.permission.ACCESS_FINE_LOCATION)) {\n                    startLocation();\n                    launchIntent(new Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS));\n                } else requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION}, LOCATION_REQUEST);\n            });\n        }\n        @JavascriptInterface public void openPackage(String pkg) {\n            if (pkg == null || pkg.length() > 200) return;\n            main.post(() -> {\n                try {\n                    Intent intent = getPackageManager().getLaunchIntentForPackage(pkg);\n                    if (intent == null) throw new Exception(\"not installed\");\n                    startActivity(intent);\n                } catch (Exception e) {\n                    sendJs(\"window.TiidaUI && TiidaUI.note('Не удалось открыть приложение')\");\n                }\n            });\n        }\n        @JavascriptInterface public void musicApp() {\n            Intent i = getPackageManager().getLaunchIntentForPackage(\"ru.yandex.music\");\n            if (i == null) {\n                sendJs(\"window.TiidaUI && TiidaUI.note('Установите Яндекс Музыку')\");\n                return;\n            }\n            launchIntent(i);\n        }\n        @JavascriptInterface public void navigation() {\n            String[] packages = {\"ru.yandex.yandexnavi\", \"ru.yandex.yandexmaps\", \"com.google.android.apps.maps\"};\n            for (String pkg : packages) {\n                Intent i = getPackageManager().getLaunchIntentForPackage(pkg);\n                if (i != null) { launchIntent(i); return; }\n            }\n            launchIntent(new Intent(Intent.ACTION_VIEW, Uri.parse(\"geo:0,0\")));\n        }\n        @JavascriptInterface public void bluetooth() {\n            launchIntent(new Intent(Settings.ACTION_BLUETOOTH_SETTINGS));\n        }\n        @JavascriptInterface public void dial(String number) {\n            if (number == null) return;\n            String safe = number.replaceAll(\"[^+0-9*#]\", \"\");\n            launchIntent(new Intent(Intent.ACTION_DIAL, Uri.parse(\"tel:\" + Uri.encode(safe))));\n        }\n        @JavascriptInterface public void musicKey(String action) {\n            int key;\n            if (\"next\".equals(action)) key = KeyEvent.KEYCODE_MEDIA_NEXT;\n            else if (\"prev\".equals(action)) key = KeyEvent.KEYCODE_MEDIA_PREVIOUS;\n            else key = KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE;\n            main.post(() -> {\n                AudioManager a = (AudioManager) getSystemService(AUDIO_SERVICE);\n                a.dispatchMediaKeyEvent(new KeyEvent(KeyEvent.ACTION_DOWN, key));\n                a.dispatchMediaKeyEvent(new KeyEvent(KeyEvent.ACTION_UP, key));\n            });\n        }\n        @JavascriptInterface public void syncMusic(boolean enable) {\n            wantsAudio = enable;\n            main.post(() -> {\n                if (!enable) {\n                    stopAudioSync();\n                    sendJs(\"window.TiidaUI && TiidaUI.syncState(false)\");\n                } else if (!granted(Manifest.permission.RECORD_AUDIO)) {\n                    requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, AUDIO_REQUEST);\n                } else startAudioSync();\n            });\n        }\n        @JavascriptInterface public void clearBackground() {\n            main.post(() -> {\n                int attempted = 0;\n                try {\n                    ActivityManager manager = (ActivityManager) getSystemService(Context.ACTIVITY_SERVICE);\n                    List<ActivityManager.RunningAppProcessInfo> list = manager.getRunningAppProcesses();\n                    if (list != null) for (ActivityManager.RunningAppProcessInfo p : list) {\n                        if (p.importance < ActivityManager.RunningAppProcessInfo.IMPORTANCE_BACKGROUND) continue;\n                        if (p.pkgList == null) continue;\n                        for (String pkg : p.pkgList) {\n                            if (pkg.equals(getPackageName()) || pkg.equals(\"ru.yandex.music\")) continue;\n                            manager.killBackgroundProcesses(pkg);\n                            attempted++;\n                        }\n                    }\n                } catch (Exception ignored) { }\n                sendJs(\"window.TiidaUI && TiidaUI.note('Очистка фона: попытка для \" + attempted + \" процессов. Android может ограничивать действие')\");\n            });\n        }\n    }\n\n    @Override public void onConfigurationChanged(Configuration configuration) {\n        super.onConfigurationChanged(configuration);\n        sendJs(\"window.TiidaUI && TiidaUI.resize()\");\n    }\n    @Override protected void onResume() {\n        super.onResume();\n        if (locations != null) startLocation();\n    }\n    @Override protected void onPause() {\n        super.onPause();\n        if (locations != null) try { locations.removeUpdates(this); } catch (Exception ignored) { }\n    }\n    @Override protected void onDestroy() {\n        stopAudioSync();\n        if (locations != null) try { locations.removeUpdates(this); } catch (Exception ignored) { }\n        if (web != null) { web.destroy(); web = null; }\n        super.onDestroy();\n    }\n    @Override public void onBackPressed() {\n        if (web != null) {\n            web.evaluateJavascript(\"window.TiidaUI ? TiidaUI.back() : 'exit'\", value -> {\n                if (\"\\\"exit\\\"\".equals(value)) super.onBackPressed();\n            });\n        } else super.onBackPressed();\n    }\n}\n","app/src/main/assets/index.html":"<!doctype html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no\">\n  <meta name=\"theme-color\" content=\"#06101f\">\n  <title>Tiida Drive 2.0</title>\n  <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n<div id=\"app\">\n  <header class=\"topbar\">\n    <div class=\"brand\">\n      <span class=\"brand-mark\"><span></span></span>\n      <div class=\"brand-text\"><strong>TIIDA <em>DRIVE</em></strong><small>PREMIUM SYSTEM <b>2.0</b></small></div>\n    </div>\n    <div class=\"top-actions\">\n      <div class=\"live-label\"><i></i><span>PREMIUM DRIVE</span></div>\n      <button class=\"top-button\" data-action=\"settings\" aria-label=\"Настройки\">⚙</button>\n    </div>\n  </header>\n  <main class=\"dashboard\">\n    <section class=\"showcase\">\n      <div class=\"scene\" id=\"scene\">\n        <div class=\"scene-atmosphere\"></div>\n        <div class=\"moon\"></div>\n        <div class=\"city city-back\">\n          <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>\n        </div>\n        <div class=\"city city-front\">\n          <span></span><span></span><span></span><span></span><span></span><span></span><span></span>\n        </div>\n        <div class=\"horizon-light\"></div>\n        <div class=\"road\"><div class=\"road-edge road-left\"></div><div class=\"road-edge road-right\"></div><div class=\"lane lane-left\"></div><div class=\"lane lane-right\"></div><div class=\"neon-track\"></div></div>\n        <div class=\"scene-top\">\n          <div class=\"scene-eyebrow\"><span class=\"pulse-dot\"></span> NIGHT EDITION <b>·</b> C11 SEDAN</div>\n          <div class=\"scene-title\">Твоя дорога.<br><span>Твой стиль.</span></div>\n        </div>\n        <div class=\"car-wrap\" id=\"car\">\n          <div class=\"car-aura\"></div>\n          <svg viewBox=\"0 0 900 455\" role=\"img\" aria-label=\"Синий седан Nissan Tiida C11\">\n            <defs>\n              <linearGradient id=\"bodyBlue\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#2b87bf\"/><stop offset=\".21\" stop-color=\"#16496e\"/><stop offset=\".52\" stop-color=\"#0e2743\"/><stop offset=\".82\" stop-color=\"#16649b\"/><stop offset=\"1\" stop-color=\"#061829\"/></linearGradient>\n              <linearGradient id=\"hood\" x1=\".12\" y1=\"0\" x2=\".8\" y2=\"1\"><stop offset=\"0\" stop-color=\"#3c9bd4\"/><stop offset=\".35\" stop-color=\"#123f65\"/><stop offset=\".78\" stop-color=\"#102e52\"/><stop offset=\"1\" stop-color=\"#062039\"/></linearGradient>\n              <linearGradient id=\"glass\" x1=\"0\" y1=\"0\" x2=\".9\" y2=\"1\"><stop offset=\"0\" stop-color=\"#3c718b\"/><stop offset=\".22\" stop-color=\"#0c253b\"/><stop offset=\".65\" stop-color=\"#050e1d\"/><stop offset=\"1\" stop-color=\"#1c4259\"/></linearGradient>\n              <linearGradient id=\"chrome\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#ecf7ff\"/><stop offset=\".55\" stop-color=\"#627b8d\"/><stop offset=\"1\" stop-color=\"#182c3c\"/></linearGradient>\n              <radialGradient id=\"lamp\" cx=\".5\" cy=\".5\" r=\".7\"><stop offset=\"0\" stop-color=\"#ffffff\"/><stop offset=\".4\" stop-color=\"#e1f8ff\"/><stop offset=\".85\" stop-color=\"#7ad8ff\"/><stop offset=\"1\" stop-color=\"#bdf8ff\" stop-opacity=\".15\"/></radialGradient>\n              <filter id=\"bloom\"><feGaussianBlur stdDeviation=\"12\"/></filter>\n            </defs>\n            <ellipse cx=\"446\" cy=\"424\" rx=\"370\" ry=\"25\" fill=\"#000b1e\" opacity=\".8\"/>\n            <path d=\"M76 319L93 259Q127 241 201 225L288 129Q318 106 397 103L535 101Q608 109 642 139L708 222Q779 245 810 271L825 326L805 382Q742 403 661 403L226 402Q130 391 86 363Z\" fill=\"url(#bodyBlue)\" stroke=\"#2e8ab9\" stroke-width=\"4\"/>\n            <path d=\"M217 226L291 139Q319 115 398 112L532 111Q602 118 625 144L687 228L535 244L354 245Z\" fill=\"#071827\" stroke=\"#4ca0cd\" stroke-width=\"5\"/>\n            <path d=\"M233 227L301 146Q326 125 399 122L516 121Q583 123 609 151L666 227L534 237L356 238Z\" fill=\"url(#glass)\"/>\n            <path id=\"side-window\" d=\"M382 128L440 124L440 234L360 233Z\" fill=\"#4a91b2\" opacity=\".2\"/>\n            <path d=\"M443 124L446 235M356 239L537 242\" stroke=\"#7ab6d4\" stroke-opacity=\".5\" stroke-width=\"6\"/>\n            <path d=\"M171 242Q328 264 451 265Q611 260 742 239L790 271L749 302Q449 334 136 293Z\" fill=\"url(#hood)\" stroke=\"#2c82af\" stroke-width=\"3\"/>\n            <path d=\"M88 291Q438 327 817 290L811 359Q698 384 449 396Q209 390 91 356Z\" fill=\"#102f50\" stroke=\"#478cb0\" stroke-width=\"4\"/>\n            <path d=\"M121 316Q180 293 